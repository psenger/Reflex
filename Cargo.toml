[workspace]
members = ["protocol", "server", "client", "certgen", "e2e"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

# Dependency versions are shared so the crates stay in lock-step.
#
# NOTE ON VERSIONS
# The original set is pinned with `=` to a mutually compatible group that was
# verified on rustc 1.75. The TLS and token dependencies added later use caret
# ranges. On a current toolchain you can relax every `=` to `^` (drop the `=`)
# and let cargo pick the latest.
#
[workspace.dependencies]
tokio = { version = "=1.38.1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "time", "sync", "signal"] }
tokio-util = { version = "=0.7.11", features = ["codec"] }
futures-util = { version = "=0.3.31", default-features = false, features = ["sink"] }
bytes = "=1.11.1"
serde = { version = "=1.0.203", features = ["derive"] }
bincode = "=1.3.3"
anyhow = "=1.0.86"
clap = { version = "4.5", features = ["derive"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pemfile = "2"
hmac = "0.12"
sha2 = "0.10"
rand = "0.8"
rcgen = "0.13"
tempfile = "3"

# A small release profile tuned for a predictable, fast binary.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
